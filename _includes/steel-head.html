{% include base_path %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181c">
{% include seo.html %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
  /* Scroll reveals: mark <html> before first paint so the blocks steel.js will
     reveal start hidden instead of flashing. Skipped for reduced motion; undone
     after 2.5s if steel.js has not taken over by then. */
  (function (d) {
    if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    d.classList.add("rv-ready");
    setTimeout(function () { if (!d.classList.contains("rv-live")) d.classList.remove("rv-ready"); }, 2500);
  })(document.documentElement);
</script>
